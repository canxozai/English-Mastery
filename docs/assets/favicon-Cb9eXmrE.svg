<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-grad)" stroke="#6366f1" stroke-width="3.5" stroke-opacity="0.6"/>

  <!-- Subtle Inner Glow -->
  <circle cx="64" cy="64" r="42" fill="#6366f1" opacity="0.18" filter="url(#glow)" />

  <!-- Layer 3: Bottom Knowledge Foundation -->
  <path d="M28 88 L64 104 L100 88 L64 72 Z" fill="none" stroke="url(#accent-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Layer 2: Intermediate Growth / Skill Layer -->
  <path d="M28 66 L64 82 L100 66 L64 50 Z" fill="none" stroke="url(#primary-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Layer 1: Top Apex Diamond / Fluency Star -->
  <path d="M28 44 L64 60 L100 44 L64 28 Z" fill="url(#primary-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Apex Sparkle Symbol (Mastery Beacon) -->
  <circle cx="64" cy="44" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="64" cy="44" r="2.5" fill="#38bdf8"/>
</svg>
