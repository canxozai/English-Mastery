<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaForge — Adaptive English Mastery System</title>
  <meta name="description" content="A comprehensive, scientifically grounded personal English learning system for real-world fluency, CEFR mastery, and English thinking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body class="dark-theme">
  <div id="app" class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-title">Lingua<span class="gradient-text">Forge</span></span>
            <span class="logo-subtitle">CEFR Mastery System</span>
          </div>
        </div>
      </div>

      <!-- Quick User Level Widget -->
      <div class="user-level-card" id="sidebar-level-card">
        <div class="level-indicator">
          <span class="level-badge" id="sidebar-cefr-badge">B1</span>
          <div class="level-info">
            <span class="level-label" id="sidebar-cefr-label">Independent User</span>
            <div class="level-progress-bar">
              <div class="level-progress-fill" id="sidebar-cefr-progress" style="width: 55%;"></div>
            </div>
          </div>
        </div>
        <div class="sidebar-stats">
          <div class="sidebar-stat" title="Current Daily Streak">
            <span class="stat-icon">🔥</span>
            <span class="stat-val" id="sidebar-streak">0 days</span>
          </div>
          <div class="sidebar-stat" title="Total XP Earned">
            <span class="stat-icon">⚡</span>
            <span class="stat-val" id="sidebar-xp">0 XP</span>
          </div>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav class="nav-menu">
        <div class="nav-section-title">OVERVIEW</div>
        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard & Routine</span>
        </button>

        <button class="nav-item" data-view="assessment" id="nav-assessment">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
          <span>Diagnostic Assessment</span>
          <span class="nav-badge" id="assessment-badge">CEFR</span>
        </button>

        <div class="nav-section-title">SKILL LABS</div>
        <button class="nav-item" data-view="grammar" id="nav-grammar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Grammar Academy</span>
        </button>

        <button class="nav-item" data-view="vocabulary" id="nav-vocabulary">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span>Spaced Repetition (SRS)</span>
          <span class="nav-badge count" id="review-due-badge">0</span>
        </button>

        <button class="nav-item" data-view="reading" id="nav-reading">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>Reading Comprehension</span>
        </button>

        <button class="nav-item" data-view="listening" id="nav-listening">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span>Listening & Phonics</span>
        </button>

        <button class="nav-item" data-view="writing" id="nav-writing">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>Writing Studio</span>
        </button>

        <button class="nav-item" data-view="speaking" id="nav-speaking">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Speaking & Roleplay</span>
        </button>

        <button class="nav-item" data-view="pronunciation" id="nav-pronunciation">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span>Pronunciation & Accent</span>
        </button>

        <div class="nav-section-title">MASTERY TOOLS</div>
        <button class="nav-item" data-view="errors" id="nav-errors">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Error Bank (Hata Defteri)</span>
          <span class="nav-badge count alert" id="errors-count-badge">0</span>
        </button>

        <button class="nav-item" data-view="progress" id="nav-progress">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Progress & Analytics</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="header-user-avatar">EN</div>
          <div class="user-details">
            <div class="user-name" id="header-username">Learner</div>
            <div class="user-status">Personal Learning Path</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content" id="main-content">
      <!-- Top App Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="current-view-title" id="page-title">Personal Dashboard</div>
        </div>

        <div class="topbar-right">
          <!-- Study Timer Widget -->
          <div class="session-timer-pill" id="session-timer-widget" title="Active Study Time This Session">
            <span class="timer-dot"></span>
            <span class="timer-text" id="session-timer">00:00</span>
          </div>

          <!-- Fast Action: Start Quick Practice -->
          <button class="btn btn-primary btn-sm" id="btn-quick-practice">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Today's Routine</span>
          </button>
        </div>
      </header>

      <!-- View Mounting Point -->
      <div class="view-viewport" id="viewport">
        <!-- Views rendered here dynamically -->
      </div>
    </main>

    <!-- Global Modal Overlay -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-card" id="modal-container">
        <!-- Dynamic modal content -->
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
